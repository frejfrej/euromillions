[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "euromillions"
dynamic = ["version"]
description = "EuroMillions number analyzer and suggestion tool"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # Older urllib3 does not notice a response cut short of its announced length.
    "urllib3>=2.0",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    # Time zone data for Europe/Paris: not every system ships it.
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
    # Type hints ship with beautifulsoup4 from 4.13 on; mypy needs them.
    "beautifulsoup4>=4.13",
]

[project.scripts]
euromillions = "euromillions.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "euromillions.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that download real data (run with EUROMILLIONS_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert `CONSTANT == expected value`, which ruff mistakes for a Yoda condition.
"tests/*" = ["SIM300"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
